name: Milestone 03
on: [push, pull_request]

jobs:
  check-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: README.md has been rewritten for your project
        run: |
          if [ ! -f README.md ]; then
            echo "FAIL: README.md is missing."
            exit 1
          fi
          # The template ships a sentinel sentence in the first paragraph.
          # If it's still there, the team hasn't replaced the template README.
          if grep -q "This is the \*\*starter template\*\* for Milestone 03" README.md; then
            echo "FAIL: README.md still contains the milestone03 template intro."
            echo "Expected: rewrite README.md to describe YOUR project — which"
            echo "skills, MCP tools, and RAG corpus you built, and how to run them."
            exit 1
          fi
          echo "OK: README.md has been edited beyond the template."

      - name: skills/ has at least one skill with a SKILL.md
        run: |
          shopt -s nullglob
          found=0
          for skill_md in skills/*/SKILL.md; do
            name="$(basename "$(dirname "$skill_md")")"
            echo "OK: skill '$name' at $skill_md"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo ""
            echo "FAIL: no skill found under skills/ (any folder containing SKILL.md)."
            echo "Expected: at least one skills/<name>/SKILL.md."
            echo "M03 brief asks for 3–5 connected skills; CI accepts at least 1."
            exit 1
          fi

      - name: mcp_servers/ has at least one student MCP server
        run: |
          shopt -s nullglob
          found=0
          for f in mcp_servers/*.py; do
            base="$(basename "$f")"
            if [ "$base" = "__init__.py" ] || [ "$base" = "example_server.py" ]; then
              continue
            fi
            echo "OK: mcp server file '$f'"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo ""
            echo "FAIL: no student MCP server under mcp_servers/."
            echo "Expected: at least one mcp_servers/<your_server>.py"
            echo "(in addition to or replacing the template example_server.py)."
            exit 1
          fi

      - name: rag/knowledge_base/ has student documents
        run: |
          shopt -s nullglob
          found=0
          for f in rag/knowledge_base/*; do
            base="$(basename "$f")"
            if [ "$base" = "EXAMPLE.md" ] || [ "$base" = ".gitkeep" ]; then
              continue
            fi
            [ -f "$f" ] || continue
            echo "OK: kb doc '$f'"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo ""
            echo "FAIL: no student documents under rag/knowledge_base/."
            echo "Expected: at least one document beyond the template EXAMPLE.md."
            echo "M03 brief asks for 10–20 proprietary documents; CI accepts at least 1."
            exit 1
          fi

      - name: rag/retrieval.py has been implemented
        run: |
          if [ ! -f rag/retrieval.py ]; then
            echo "FAIL: rag/retrieval.py is missing."
            exit 1
          fi
          # The template stub leaves a `TODO: implement` marker inside retrieve().
          if grep -q "TODO: implement" rag/retrieval.py; then
            echo "FAIL: rag/retrieval.py still contains the stub TODO marker."
            echo "Expected: implement retrieve(query, top_k) so it returns relevant"
            echo "chunks from rag/knowledge_base/ (keyword or vector — see rag/README.md)."
            exit 1
          fi
          echo "OK: rag/retrieval.py has been implemented."
