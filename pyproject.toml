[project]
name = "milestone03"
version = "0.1.0"
description = "Milestone 03 student starter — GenAI for Business"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "ipykernel>=6.29",
    "ipython>=8.0",
    "requests>=2.32",
    "pyarrow>=17",
    "mcp>=1.27.1",
    "plotnine>=0.15.4",
    "google-api-python-client>=2.196.0",
    "youtube-transcript-api>=1.2.4",
    "vadersentiment>=3.3.2",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "jupyter-server-proxy>=4.5.0",
    "deepeval>=4.0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests that make real network calls to the TritonAI API (skipped by default)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
