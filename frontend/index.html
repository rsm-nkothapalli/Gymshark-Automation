<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gymshark Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/styles-layout.css">
<link rel="stylesheet" href="/css/styles-theater.css">
<link rel="stylesheet" href="/css/styles-outreach.css">
<link rel="stylesheet" href="/css/styles-pages.css">
</head>
<body>
<div id="root">
  <div class="app">

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sb-logo">G</div>
      <button class="sb-btn active" data-page="scoring" onclick="nav('scoring')" title="Scoring">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      </button>
      <button class="sb-btn" data-page="profile" onclick="nav('profile')" title="Creator Profile">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </button>
      <button class="sb-btn" data-page="outreach" onclick="nav('outreach')" title="Outreach">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </button>
      <button class="sb-btn" data-page="brief" onclick="nav('brief')" title="Product Brief">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      </button>
<button class="sb-btn" data-page="analytics" onclick="nav('analytics')" title="Performance">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      </button>
      <button class="sb-btn" data-page="leaderboard" onclick="nav('leaderboard')" title="Leaderboard">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M8 21V12m4 9V3m4 18v-6"/><path d="M3 21h18"/></svg>
      </button>
      <div class="sb-divider"></div>
      <div class="sb-spacer"></div>
      <div id="profile-avatar-btn" style="position:relative">
        <div class="avatar-sm" onclick="state.showProfileMenu=!state.showProfileMenu;renderProfileMenu()" style="cursor:pointer" id="profile-avatar">N</div>
        <div id="profile-menu-popup" style="display:none;position:fixed;bottom:60px;left:60px;background:#1a1a1a;border:1px solid var(--border);border-radius:10px;padding:8px;min-width:210px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.5)"></div>
      </div>
    </nav>

    <!-- Main content -->
    <div class="main" id="main-content">
      <!-- Pages injected here -->
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <div class="toast-dot"></div>
  <span id="toast-msg"></span>
</div>

<script>
const API = '';
let state = {
  userRole: 'analyst',
  showProfileMenu: false,
  creators: [],
  selectedCreator: null,
  selectedVideo: null,
  creatorVideos: [],
  videosLoading: false,
  videosError: null,
  currentPage: 'scoring',
  outreachDraft: '',
  outreachDealType: null,
  outreachTone: 'warm',
  outreachLoading: false,
  outreachStatus: null,
  brandFitAnalysis: null,
  brandFitLoading: false,
  ragSources: [],
  ragMatch: null,
  evidenceData: null,
  evidenceLoading: false,
  activeRagSource: null,
  analyticsData: null,
};

// ── profile menu ─────────────────────────────────────────────────────────────

function renderProfileMenu() {
  const popup = document.getElementById('profile-menu-popup');
  const avatar = document.getElementById('profile-avatar');
  if (!popup) return;
  if (!state.showProfileMenu) {
    popup.style.display = 'none';
    return;
  }
  const isManager = ['manager','director'].includes(state.userRole);
  if (avatar) avatar.style.border = `2px solid ${isManager ? 'var(--neon)' : 'var(--border)'}`;
  popup.style.display = 'block';
  popup.innerHTML = `
    <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-3);padding:6px 10px 8px">Job Role</div>
    ${[['analyst','Partnerships Analyst'],['manager','Partnerships Manager']].map(([val,label]) => `
    <div onclick="setRole('${val}')" style="padding:8px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:${state.userRole===val?700:400};color:${state.userRole===val?'var(--neon)':'var(--text-2)'};background:${state.userRole===val?'rgba(181,254,0,0.08)':'transparent'};display:flex;align-items:center;justify-content:space-between">
      <span>${label}</span>${state.userRole===val?'<span>✓</span>':''}
    </div>`).join('')}`;
}

function setRole(val) {
  state.userRole = val;
  state.showProfileMenu = false;
  renderProfileMenu();
  render();
}

// close profile menu when clicking outside
document.addEventListener('click', function(e) {
  if (state.showProfileMenu && !document.getElementById('profile-avatar-btn')?.contains(e.target)) {
    state.showProfileMenu = false;
    renderProfileMenu();
  }
});

// ── navigation ────────────────────────────────────────────────────────────────

function nav(page) {
  state.currentPage = page;
  document.querySelectorAll('.sb-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  render();
}

// ── toast ─────────────────────────────────────────────────────────────────────

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.className = `toast ${type}`;
  document.getElementById('toast-msg').textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ── data fetching ─────────────────────────────────────────────────────────────

async function fetchCreators() {
  try {
    const res = await fetch(`${API}/api/creators`);
    state.creators = await res.json();
    render();
  } catch(e) {
    toast('Failed to load creators', 'error');
  }
}

async function generateOutreach(creatorId) {
  if (state.outreachLoading) return;
  state.outreachLoading = true;
  state.outreachDraft = '';
  state.outreachStatus = null;
  render();
  try {
    const res = await fetch(`${API}/api/creators/${creatorId}/outreach`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({tone: state.outreachTone, deal_type: state.outreachDealType || ''}),
    });
    const data = await res.json();
    state.outreachDraft = data.draft;
    state.ragSources = data.rag_sources || [];
    toast('Outreach draft generated');
  } catch(e) {
    toast('Failed to generate outreach', 'error');
  }
  state.outreachLoading = false;
  render();
}

async function generateBrief(creatorId) {
  try {
    const res = await fetch(`${API}/api/creators/${creatorId}/brief`, {method: 'POST'});
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    return data.brief;
  } catch(e) {
    return `Error generating brief: ${e.message}`;
  }
}

async function fetchAnalytics() {
  try {
    const res = await fetch(`${API}/api/analytics`);
    state.analyticsData = await res.json();
    render();
  } catch(e) {
    toast('Failed to load analytics', 'error');
  }
}

// ── format helpers ────────────────────────────────────────────────────────────

function fmtGBP(n) {
  if (n >= 1000000) return `£${(n/1000000).toFixed(1)}M`;
  if (n >= 1000) return `£${(n/1000).toFixed(0)}K`;
  return `£${n}`;
}

function fmtNum(n) {
  if (n >= 1000000) return `${(n/1000000).toFixed(1)}M`;
  if (n >= 1000) return `${(n/1000).toFixed(0)}K`;
  return String(n);
}

function initials(name) {
  return name.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function safetyBadge(safety) {
  const map = {GREEN: 'badge-green', AMBER: 'badge-amber', RED: 'badge-red'};
  return `<span class="badge ${map[safety] || 'badge-grey'}">${safety}</span>`;
}

// ── render ────────────────────────────────────────────────────────────────────

function render() {
  const el = document.getElementById('main-content');
  if (state.currentPage === 'scoring') el.innerHTML = renderScoringPage();
  else if (state.currentPage === 'profile') el.innerHTML = renderProfilePage();
  else if (state.currentPage === 'outreach') el.innerHTML = renderOutreachPage();
  else if (state.currentPage === 'brief') el.innerHTML = renderBriefPage();
else if (state.currentPage === 'analytics') el.innerHTML = renderAnalyticsPage();
  else if (state.currentPage === 'leaderboard') el.innerHTML = renderLeaderboardPage();
}

// ── OUTREACH page (3-panel) ───────────────────────────────────────────────────

function renderOutreachPage() {
  const c = state.selectedCreator;
  if (!c) {
    return `
    <div style="display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#111;">
      <div class="topbar">
        <span class="topbar-title"><span class="neon">Gymshark</span> Nexus</span>
        <div class="topbar-crumbs"><span>Pipeline</span><span class="sep">/</span><span class="current">Outreach</span></div>
        <div class="topbar-right"><div class="avatar-sm">N</div></div>
      </div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:var(--text-3)">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        <p style="font-size:13px">No creator selected — start from Scoring</p>
        <button onclick="nav('scoring')" style="padding:8px 16px;background:var(--neon);color:#000;font-weight:700;border:none;border-radius:8px;cursor:pointer;font-size:12px">← Go to Scoring</button>
      </div>
    </div>`;
  }
  return `
  <div style="display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#111;">
    <div class="topbar">
      <span class="topbar-title"><span class="neon">Gymshark</span> Nexus</span>
      <div class="topbar-crumbs">
        <span>Pipeline</span><span class="sep">/</span>
        <span onclick="nav('scoring')" style="cursor:pointer;color:var(--text-2)">Scoring</span><span class="sep">/</span>
        <span onclick="nav('profile')" style="cursor:pointer;color:var(--text-2)">${c.name}</span><span class="sep">/</span>
        <span class="current">Outreach</span>
      </div>
      <div class="topbar-right"><div class="live-dot"></div><span>${c.name}</span><div class="avatar-sm">N</div></div>
    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px">
      <div style="width:100%;max-width:640px;height:100%;display:flex;flex-direction:column">
        ${renderOutreachPanel()}
      </div>
    </div>
  </div>`;
}

function renderCreatorQueue() {
  const filters = ['All', 'nano', 'micro', 'mid', 'macro'];
  const filterHTML = filters.map(f =>
    `<button class="chip-filter on" onclick="">${f}</button>`
  ).join('');

  const cards = state.creators.map((c, i) => {
    const active = state.selectedCreator?.id === c.id ? 'active' : '';
    const tierClass = c.gfs_tier;
    const tagHTML = c.tags.slice(0, 2).map(t =>
      `<span class="tag neon">#${t.replace(/\s+/g,'_').toUpperCase()}</span>`
    ).join('');
    return `
    <div class="creator-card ${active}" onclick="selectCreator('${c.id}')">
      <div class="avatar" style="background:${avatarColor(c.name)}">${initials(c.name)}
        <div class="platform">▶</div>
      </div>
      <div class="creator-meta">
        <div class="creator-handle">${c.name}</div>
        <div class="creator-subs"><a href="https://www.youtube.com/${c.handle}" target="_blank" onclick="event.stopPropagation()" style="color:var(--text-2);text-decoration:none;border-bottom:1px solid var(--border)">${c.handle}</a> · ${c.subscribers_fmt} subs</div>
        <div class="creator-chips">${tagHTML}</div>
      </div>
      <div class="gfs-badge ${tierClass}">
        <div class="gfs-score">${c.gfs}</div>
        <div class="gfs-label">${c.gfs_tier.toUpperCase()} GFS</div>
      </div>
    </div>`;
  }).join('');

  const countHTML = state.creators.length === 0
    ? `<div style="padding:40px;text-align:center;color:var(--text-3)"><div class="loading-spinner"></div><p style="margin-top:12px;font-size:12px;">Loading creators...</p></div>`
    : cards;

  return `
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title"><span class="pt-num">01</span>Creator shortlist queue</div>
      <span style="font-size:10px;color:var(--text-3);font-family:monospace">${state.creators.length} total</span>
    </div>
    <div class="queue-filter">${filterHTML}</div>
    <div class="panel-body scroll">${countHTML}</div>
  </div>`;
}

function renderTheater() {
  const c = state.selectedCreator;
  if (!c) {
    return `
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="pt-num">02</span>Media Theater</div>
      </div>
      <div class="theater-empty">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <p>Select a creator to view their content</p>
      </div>
    </div>`;
  }

  const tags = c.tags.map(t =>
    `<span class="theme-chip">#${t.replace(/\s+/g,'_').toUpperCase()}</span>`
  ).join('');

  const v = state.selectedVideo;
  const ytHandle = c.handle.replace('@','');

  let videoBlock = '';
  if (state.videosLoading) {
    videoBlock = `
    <div class="video-wrap" style="display:flex;align-items:center;justify-content:center;gap:10px;color:var(--text-3)">
      <div class="loading-spinner"></div>
      <span style="font-size:12px">Fetching YouTube videos...</span>
    </div>`;
  } else if (state.videosError) {
    const ytSearch = `https://www.youtube.com/results?search_query=${encodeURIComponent(c.name)}`;
    videoBlock = `
    <div class="video-wrap" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text-3);padding:24px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button onclick="resolveHandle('${c.id}')" style="font-size:11px;color:#000;padding:6px 12px;background:var(--neon);border-radius:6px;font-weight:700;cursor:pointer;border:none">
          Auto-fix Handle
        </button>
        <a href="https://www.youtube.com/${c.handle}" target="_blank" style="font-size:11px;color:var(--neon);padding:6px 10px;background:rgba(181,254,0,0.08);border:1px solid rgba(181,254,0,0.25);border-radius:6px">${c.handle} ↗</a>
      </div>
    </div>`;
  } else if (v) {
    videoBlock = `
    <div class="video-wrap">
      <div class="video-thumb">
        <img src="${v.thumbnail}" alt="${v.title}" style="width:100%;height:100%;object-fit:cover">
      </div>
      <div class="video-overlay">
        <div class="video-title" style="font-size:13px">${v.title}</div>
        <div class="video-sub"><span>${fmtNum(v.views)} views</span><span>${v.published_at}</span></div>
      </div>
      <a class="play-btn" href="${v.url}" target="_blank">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </a>
      <span class="duration-pill">${v.published_at}</span>
    </div>
    ${state.creatorVideos.length > 1 ? `
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px">
      ${state.creatorVideos.map((vid, i) => `
        <div onclick="selectVideo(${i})" style="flex-shrink:0;width:100px;cursor:pointer;border-radius:6px;overflow:hidden;border:2px solid ${state.selectedVideo?.video_id===vid.video_id?'var(--neon)':'transparent'}">
          <img src="${vid.thumbnail}" style="width:100%;height:56px;object-fit:cover;display:block">
          <div style="background:#181818;padding:4px 6px;font-size:9px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${vid.title}</div>
        </div>`).join('')}
    </div>` : ''}`;
  } else {
    const ytSearch = `https://www.youtube.com/results?search_query=${encodeURIComponent(c.name)}`;
    videoBlock = `
    <div class="video-wrap" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text-3);padding:24px">
      <span style="font-size:12px">No videos found for this channel</span>
      <div style="display:flex;gap:8px">
        <a href="https://www.youtube.com/@${ytHandle}" target="_blank" style="font-size:11px;color:var(--neon);padding:6px 10px;background:rgba(181,254,0,0.08);border:1px solid rgba(181,254,0,0.25);border-radius:6px">@${ytHandle} ↗</a>
        <a href="${ytSearch}" target="_blank" style="font-size:11px;color:var(--text-2);padding:6px 10px;background:#1c1c1c;border:1px solid var(--border);border-radius:6px">Search "${c.name}" ↗</a>
      </div>
    </div>`;
  }

  return `
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title"><span class="pt-num">02</span>Media Theater</div>
      <span style="font-size:11px;color:var(--text-3)">${c.name}</span>
    </div>
    <div class="theater scroll">
      ${videoBlock}

      <!-- Stats -->
      <div class="stat-grid">
        <div class="stat-cell">
          <div class="lbl">GFS Score</div>
          <div class="val" style="color:${c.gfs_tier==='high'?'var(--neon)':c.gfs_tier==='mid'?'var(--amber)':'var(--text-3)'}">${c.gfs}</div>
          <div class="delta">${c.gfs_tier.toUpperCase()}</div>
        </div>
        <div class="stat-cell">
          <div class="lbl">Subscribers</div>
          <div class="val">${c.subscribers_fmt}</div>
          <div class="delta">${c.tier}</div>
        </div>
        <div class="stat-cell">
          <div class="lbl">Brand Safety</div>
          <div class="val" style="font-size:13px;color:${c.brand_safety==='GREEN'?'var(--neon)':c.brand_safety==='RED'?'var(--red)':'var(--amber)'}">${c.brand_safety}</div>
        </div>
        <div class="stat-cell">
          <div class="lbl">Deal Type</div>
          <div class="val" style="font-size:11px;margin-top:4px">${(c.deal_type||'').replace(/_/g,' ').toUpperCase()}</div>
        </div>
      </div>

      <!-- AI Themes -->
      <div class="theme-section">
        <h4>AI Context Themes <span class="ai-tag">AI</span></h4>
        <div class="theme-chips">${tags || '<span style="color:var(--text-3);font-size:12px;">No tags available</span>'}</div>
      </div>

      <!-- Engagement bars -->
      <div>
        ${[
          ['Authenticity', c.authenticity_score, 10],
          ['Niche Fit', c.niche_score, 10],
          ['Engagement', c.engagement_score, 10],
          ['Sentiment', c.comment_sentiment_score, 10],
        ].map(([label, val, max]) => {
          const v = parseFloat(val) || 0;
          const pct = Math.min(100, (v/max)*100);
          return `
          <div class="eng-row">
            <div class="eng-label">${label}</div>
            <div class="eng-bar"><div class="eng-bar-fill" style="width:${pct}%"></div></div>
            <div class="eng-val">${v}/${max}</div>
          </div>`;
        }).join('')}
      </div>

      <div style="background:#181818;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;color:var(--text-2);line-height:1.6">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-3)">Brand Fit Analysis <span class="ai-tag">AI</span></div>
          ${!state.brandFitAnalysis && !state.brandFitLoading ? `
          <button onclick="generateBrandFit('${c.id}')" style="font-size:10px;padding:4px 10px;background:rgba(181,254,0,0.1);border:1px solid rgba(181,254,0,0.3);color:var(--neon);border-radius:6px;cursor:pointer;font-weight:600">Generate</button>` : ''}
        </div>
        ${state.brandFitLoading ? `
          <div style="display:flex;align-items:center;gap:8px;color:var(--text-3)"><div class="loading-spinner"></div><span>Analysing with LLM...</span></div>` :
          state.brandFitAnalysis ? `<div>${state.brandFitAnalysis}</div>` :
          `<div style="color:var(--text-3)">${c.brand_fit_reasoning || 'Click Generate for a detailed AI analysis.'}</div>`}
      </div>
    </div>
  </div>`;
}

function renderOutreachPanel() {
  const c = state.selectedCreator;
  if (!c) {
    return `
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="pt-num">03</span>Personalized email draft</div>
      </div>
      <div class="outreach-empty">
        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        <p>Select a creator then generate outreach</p>
      </div>
    </div>`;
  }

  const hasBlocked = !c.outreach_recommended || c.brand_safety === 'RED';

  return `
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title"><span class="pt-num">03</span>Personalized email draft</div>
    </div>
    <div class="outreach scroll" style="overflow-y:auto">
      <div class="out-meta">
        <div class="avatar" style="background:${avatarColor(c.name)}">${initials(c.name)}</div>
        <div class="out-meta-text">
          <div class="out-meta-name">${c.name}</div>

// ── actions ───────────────────────────────────────────────────────────────────

function selectCreator(id) {
  state.selectedCreator = state.creators.find(c => c.id === id) || null;
  state.outreachDraft = '';
  state.outreachDealType = null;
  state.outreachTone = 'warm';
  state.outreachStatus = null;
  state.brandFitAnalysis = null;
  state.brandFitLoading = false;
  state.creatorVideos = [];
  state.selectedVideo = null;
  state.videosError = null;
  render();
  if (state.selectedCreator) fetchCreatorVideos(id);
}

async function fetchEvidence(creatorId) {
  state.evidenceLoading = true;
  state.evidenceData = null;
  render();
  try {
    const res = await fetch(`${API}/api/evidence/${creatorId}`);
    state.evidenceData = await res.json();
  } catch(e) {
    state.evidenceData = {error: 'Failed to load evidence'};
  }
  state.evidenceLoading = false;
  render();
}

async function fetchRagMatch(creatorId) {
  try {
    const res = await fetch(`${API}/api/creators/${creatorId}/rag-match`);
    const data = await res.json();
    state.ragMatch = data.match ? data : null;
    render();
  } catch(e) {}
}

async function generateBrandFit(creatorId) {
  state.brandFitLoading = true;
  render();
  try {
    const res = await fetch(`${API}/api/creators/${creatorId}/brand-fit`, { method: 'POST' });
    const data = await res.json();
    state.brandFitAnalysis = data.analysis;
  } catch(e) {
    state.brandFitAnalysis = 'Failed to generate analysis.';
  }
  state.brandFitLoading = false;
  render();
}

async function fetchCreatorVideos(creatorId) {
  state.videosLoading = true;
  render();
  try {
    const res = await fetch(`${API}/api/creators/${creatorId}/videos`);
    if (!res.ok) {
      const err = await res.json();
      state.videosError = err.detail || 'Failed to load videos';
      state.creatorVideos = [];
    } else {
      const data = await res.json();
      state.creatorVideos = data.videos || [];
      state.selectedVideo = state.creatorVideos[0] || null;
      state.videosError = null;
    }
  } catch(e) {
    state.videosError = 'YouTube API unavailable';
    state.creatorVideos = [];
  }
  state.videosLoading = false;
  render();
}

async function resolveHandle(creatorId) {
  toast('Searching YouTube for real handle...', 'success');
  try {
    const res = await fetch(`${API}/api/creators/${creatorId}/resolve-handle`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) { toast(data.detail || 'Failed', 'error'); return; }
    if (!data.resolved) { toast('No channel found on YouTube', 'error'); return; }

    const best = data.best;
    const confirmed = confirm(
      `Found: "${best.title}" (${best.handle}, ${fmtNum(best.subscribers)} subs)\n\nUpdate handle from ${data.old_handle} to ${best.handle}?`
    );
    if (!confirmed) return;

    // Reload creators and re-fetch videos with new handle
    await fetchCreators();
    toast(`Handle updated to ${best.handle}`);
    fetchCreatorVideos(creatorId);
  } catch(e) {
    toast('Error resolving handle', 'error');
  }
}

function selectVideo(index) {
  state.selectedVideo = state.creatorVideos[index] || null;
  render();
}

function selectOnScoring(id) {
  state.selectedCreator = state.creators.find(c => c.id === id) || null;
  render();
}

function goToProfile(id) {
  state.selectedCreator = state.creators.find(c => c.id === id) || null;
  state.brandFitAnalysis = null;
  state.brandFitLoading = false;
  state.ragSources = [];
  state.ragMatch = null;
  state.creatorVideos = [];
  state.selectedVideo = null;
  state.videosError = null;
  nav('profile');
  fetchCreatorVideos(id);
  fetchRagMatch(id);
}

function selectAndGoTo(id) {
  state.selectedCreator = state.creators.find(c => c.id === id) || null;
  nav('outreach');
}

function copyDraft() {
  const ta = document.getElementById('email-draft');
  if (ta) {
    navigator.clipboard.writeText(ta.value);
    toast('Draft copied to clipboard');
  }
}

function submitForApproval() {
  const ta = document.getElementById('email-draft');
  if (ta) state.outreachDraft = ta.value;
  state.outreachStatus = 'pending';
  render();
  toast('Draft submitted for approval');
}

function approveOutreach() {
  state.outreachStatus = 'approved';
  render();
  toast('Outreach approved');
}

function rejectOutreach() {
  state.outreachStatus = null;
  render();
  toast('Draft rejected — please revise', 'error');
}

function sendOutreach() {
  state.outreachStatus = 'sending';
  render();
  setTimeout(() => {
    state.outreachStatus = 'sent';
    render();
    toast(`Outreach sent for ${state.selectedCreator?.name}`);
  }, 2000);
}

async function runGenerateBrief() {
  const select = document.getElementById('brief-creator-select');
  const id = select?.value;
  if (!id) { toast('Select a creator first', 'error'); return; }

  const container = document.getElementById('brief-output-container');
  if (container) {
    container.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;color:var(--text-3);padding:20px">
        <div class="loading-spinner"></div>
        <span style="font-size:13px">Generating brief with LLM...</span>
      </div>
    </div>`;
  }

  const brief = await generateBrief(id);
  const creator = state.creators.find(c => c.id === id);

  if (container) {
    container.innerHTML = `
    <div class="card">
      <div class="card-head">
        <div><div class="ttl">Product Brief — ${creator?.name || id}</div><div class="sub">Generated by Llama 4 Scout</div></div>
        <button class="btn-ghost" style="width:auto;padding:8px 14px" onclick="copyBrief()">Copy</button>
      </div>
      <div class="brief-output" id="brief-text">${brief}</div>
    </div>`;
    toast('Brief generated successfully');
  }
}

function copyBrief() {
  const el = document.getElementById('brief-text');
  if (el) {
    navigator.clipboard.writeText(el.textContent);
    toast('Brief copied to clipboard');
  }
}

// ── avatar color ──────────────────────────────────────────────────────────────

function avatarColor(name) {
  const colors = ['#1a3a1a','#2a1a3a','#3a2a1a','#1a2a3a','#3a1a2a'];
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % colors.length;
  return colors[h];
}

// ── init ──────────────────────────────────────────────────────────────────────

fetchCreators();
fetchAnalytics();
render();
</script>
